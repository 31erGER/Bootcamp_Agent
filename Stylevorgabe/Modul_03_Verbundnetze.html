<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wb-course" content="Beispielkurs">
<title>Modul 03a · Verbundnetze — Aufgabenheft</title>

<!-- ═══════════════════════════════════════════════════════════════════════════
     Aufgabenheft Modul 03a. Diese Datei ist nur noch das Gerüst: die Aufgaben
     stehen in Modul_03_Verbundnetze.data.js, das Aussehen in assets/styles.css,
     die Logik in assets/engine.js.

     Vorher waren es 423 KB in einer Datei — davon 340 KB Schriftdaten als
     base64, und zwar in JEDER HTML erneut. Jetzt liegen die Schriften einmal in
     assets/fonts.css, und ein weiteres Blatt kostet keine Schriftbytes mehr.

     Skriptreihenfolge ist bindend:
       engine.js     definiert WB.register
       validate.js   Redaktionsregeln (nur zum Prüfen nötig, stört sonst nicht)
       *.data.js     ruft WB.register und rendert damit das Blatt
       viz.js        definiert WB.viz.define
       *.viz.js      die Zeichnungen dieses Blattes
       audit.js      Selbstprüfung, wird nur mit einem Anker aktiv

     Prüfen:  Modul_03_Verbundnetze.html#pruefen
              assets/breiten.html?page=../Modul_03_Verbundnetze.html
     ═══════════════════════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="shell">

  <aside class="rail">
    <div class="brand">
      <div class="brand__mark">Energieversorgung</div>
      <div class="brand__name">Modul 03a</div>
      <div class="brand__sub">Verbundnetze · Regelzonen &amp; Frequenzhaltung</div>
    </div>

    <div class="progress">
      <div class="progress__ring">
        <svg width="64" height="64" aria-hidden="true">
          <circle class="progress__track" cx="32" cy="32" r="28" fill="none" stroke-width="6"></circle>
          <circle class="progress__arc" data-arc cx="32" cy="32" r="28" fill="none" stroke-width="6"></circle>
        </svg>
        <div class="progress__pct" data-progress-pct>0%</div>
      </div>
      <div class="progress__meta">
        <div class="progress__count" data-progress-count><b>0</b> / 0</div>
        <div class="progress__label">gelöst</div>
        <div class="progress__score" data-progress-score>0 / 0 Punkte</div>
      </div>
    </div>

    <nav class="nav" aria-label="Aufgaben"></nav>

    <div class="rail__foot">
      <div class="filters" role="group" aria-label="Aufgaben filtern">
        <button class="filter is-active" type="button" data-filter="alle">Alle</button>
        <button class="filter" type="button" data-filter="offen">Offen</button>
        <button class="filter" type="button" data-filter="geloest">Gelöst</button>
        <button class="filter" type="button" data-filter="leicht">Leicht</button>
        <button class="filter" type="button" data-filter="mittel">Mittel</button>
        <button class="filter" type="button" data-filter="schwer">Schwer</button>
      </div>
      <div class="note-strip" data-store-warning hidden>
        <b>Kein Speicher.</b> Dieser Browser sperrt <code>localStorage</code> auf
        <code>file://</code> — der Stand überlebt kein Neuladen.
      </div>
      <div class="filters">
        <a class="filter" href="index.html">Übersicht</a>
        <a class="filter" href="Fourier_Lehrkurs.html">Lehrkurs</a>
        <button class="filter" type="button" data-reset>Stand löschen</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="masthead" data-masthead></header>
    <section class="intro" data-intro></section>
    <div class="stats" data-stats></div>

    <figure class="viz" data-viz="frequenzeinbruch" data-viz-opts='{"height":330}'>
      <div class="viz__title">Frequenz nach einem Kraftwerksausfall</div>
      <canvas></canvas>
      <div class="viz__ctrl">
        <label>Ausgefallene Leistung
          <input type="range" data-ctl="dp" min="300" max="3000" step="100" value="1200">
          <output class="viz__read" data-out="dp">1200 MW</output>
        </label>
        <label>Netzleistungszahl
          <input type="range" data-ctl="lam" min="8000" max="25000" step="1000" value="15000">
          <output class="viz__read" data-out="lam">15000 MW/Hz</output>
        </label>
      </div>
      <figcaption class="viz__cap">
        Die Reglerstellung entspricht dem Lastfall aus Aufgabe&nbsp;14. Der Tiefpunkt liegt
        <b>unter</b> dem Wert, auf dem die Frequenz danach stehen bleibt — die Trägheit der Läufer
        lässt sie durchschwingen, bevor die Primärregelung sie fängt. Stehen bleibt sie bei
        50&nbsp;Hz minus ΔP/λ, und erst die Sekundärregelung holt sie zurück. Zieh die
        Netzleistungszahl herunter, und du siehst, warum ein kleines Netz gefährdet ist.
      </figcaption>
    </figure>

    <div data-sheet></div>

    <footer class="foot">
      <span>Modul 03a · Verbundnetze · Aufgabenheft</span>
      <span>läuft ohne Server, ohne Build</span>
    </footer>
  </main>

</div>

<script src="assets/engine.js"></script>
<script src="assets/validate.js"></script>
<script src="Modul_03_Verbundnetze.data.js"></script>
<script src="assets/viz.js"></script>
<script src="assets/viz-verbundnetz.js"></script>
<script src="assets/audit.js"></script>
</body>
</html>
