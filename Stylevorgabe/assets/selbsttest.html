<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selbsttest · alle neun Aufgabentypen</title>

<!-- ═══════════════════════════════════════════════════════════════════════════
     Das GERÜST eines Aufgabenblattes. Wer ein neues Blatt anlegt, kopiert diese
     Datei, tauscht den Titel und die eine data.js-Zeile — sonst nichts.

     Alles Sichtbare kommt aus der Datendatei. Die Attribute [data-…] sind die
     Andockpunkte, an denen engine.js einhängt:

       [data-masthead]        Kopf: Rubrik, Dauer, Überschrift, Vorspann, Signatur
       [data-intro]           Einleitung links, Merkstreifen rechts
       [data-stats]           die vier Kennzahlen
       [data-sheet]           die Teile mit den Aufgaben          ← Pflicht
       .rail .nav             Aufgabenliste, wird gefüllt
       [data-progress-*]      Ringzahl, Zähler, Punktestand
       [data-arc]             der Ring selbst (r wird ausgelesen)
       [data-filter]          Filterknöpfe: alle offen geloest leicht mittel schwer
       [data-reset]           Stand löschen
       [data-store-warning]   erscheint nur, wenn localStorage gesperrt ist

     Skriptreihenfolge ist bindend: engine.js definiert WB.register, die
     Datendatei ruft es auf, audit.js hängt sich hinterher an.
     ═══════════════════════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="shell">

  <aside class="rail">
    <div class="brand">
      <div class="brand__mark">Rahmenwerk</div>
      <div class="brand__name">Selbsttest</div>
      <div class="brand__sub">Neun Typen, ein Durchlauf</div>
    </div>

    <div class="progress">
      <div class="progress__ring">
        <svg width="64" height="64" aria-hidden="true">
          <circle class="progress__track" cx="32" cy="32" r="28" fill="none" stroke-width="6"></circle>
          <circle class="progress__arc" data-arc cx="32" cy="32" r="28" fill="none" stroke-width="6"></circle>
        </svg>
        <div class="progress__pct" data-progress-pct>0%</div>
      </div>
      <div class="progress__meta">
        <div class="progress__count" data-progress-count><b>0</b> / 0</div>
        <div class="progress__label">gelöst</div>
        <div class="progress__score" data-progress-score>0 / 0 Punkte</div>
      </div>
    </div>

    <nav class="nav" aria-label="Aufgaben"></nav>

    <div class="rail__foot">
      <div class="filters" role="group" aria-label="Aufgaben filtern">
        <button class="filter is-active" type="button" data-filter="alle">Alle</button>
        <button class="filter" type="button" data-filter="offen">Offen</button>
        <button class="filter" type="button" data-filter="geloest">Gelöst</button>
        <button class="filter" type="button" data-filter="schwer">Schwer</button>
      </div>
      <div class="note-strip" data-store-warning hidden>
        <b>Kein Speicher.</b> Dieser Browser sperrt <code>localStorage</code> auf
        <code>file://</code> — der Stand überlebt kein Neuladen.
      </div>
      <button class="filter" type="button" data-reset>Stand löschen</button>
    </div>
  </aside>

  <main class="main">
    <header class="masthead" data-masthead></header>
    <section class="intro" data-intro></section>
    <div class="stats" data-stats></div>

    <!-- Eine Visualisierung, deklarativ eingebunden: kein Skript im Blatt.
         data-ctl gibt den Namen im Parameterobjekt, data-out zeigt den Wert an
         und behält seine Einheit aus dem Text. -->
    <figure class="viz" data-viz="frequenzeinbruch" data-viz-opts='{"height":330}'>
      <div class="viz__title">Frequenz nach einem Kraftwerksausfall</div>
      <canvas></canvas>
      <div class="viz__ctrl">
        <label>Ausgefallene Leistung
          <input type="range" data-ctl="dp" min="300" max="3000" step="100" value="900">
          <output class="viz__read" data-out="dp">900 MW</output>
        </label>
        <label>Netzleistungszahl
          <input type="range" data-ctl="lam" min="8000" max="25000" step="1000" value="15000">
          <output class="viz__read" data-out="lam">15000 MW/Hz</output>
        </label>
      </div>
      <figcaption class="viz__cap">
        Der Tiefpunkt liegt <b>unter</b> dem Wert, auf dem die Frequenz danach stehen bleibt —
        die Trägheit lässt sie durchschwingen, bevor die Primärregelung sie fängt. Stehen bleibt
        sie bei 50 Hz minus ΔP/λ, und erst die Sekundärregelung holt sie zurück.
        Man sieht auch, warum ein kleines Netz gefährdet ist: bei λ = 8000 MW/Hz wirft derselbe
        Ausfall die Frequenz doppelt so weit wie bei 16 000.
      </figcaption>
    </figure>

    <div data-sheet></div>

    <footer class="foot">
      <span>Rahmenwerk · Selbsttest</span>
      <span>läuft ohne Server, ohne Build</span>
    </footer>
  </main>

</div>

<script src="engine.js"></script>
<script src="validate.js"></script>
<script src="selbsttest.data.js"></script>
<!-- viz.js VOR den Zeichnungen: es stellt WB.viz.define bereit. -->
<script src="viz.js"></script>
<script src="viz-verbundnetz.js"></script>
<script src="audit.js"></script>
</body>
</html>
