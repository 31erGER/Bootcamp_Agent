<?xml version="1.0" encoding="UTF-8"?>
<!-- ═══════════════════════════════════════════════════════════════════════════
     schema-spektrum.svg — Linienspektrum für die Hotspot-Aufgabe in Modul 01.

     Die CDATA-Klammer um das Stylesheet ist PFLICHT und kein Schmuck: der
     Inhalt eines <style>-Elements wird in XML als Markup gelesen. Ein spitzes
     Zeichen im CSS oder in einem Kommentar darin — etwa der Name des
     Elements <img> — macht die Datei zu ungültigem XML, und dann dekodiert der
     Browser sie GAR NICHT. Das Bild bleibt leer, ohne Konsolenfehler.
     Nachgemessen im AuD-Bootcamp: sechs von sieben SVG waren so kaputt.

     Das Bild beschriftet die Antwort NICHT. Es zeigt sechs Linien und eine
     Frequenzachse in Hertz; welche Linie im Spektrum eines symmetrischen
     Rechtecksignals nichts zu suchen hat, muss man wissen und nicht ablesen.
     ═══════════════════════════════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"
     role="img" aria-label="Linienspektrum mit sechs Spektrallinien über einer Frequenzachse in Hertz" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style><![CDATA[
    .grund  { fill: #f6f2ea; }
    .achse  { stroke: #3a352c; stroke-width: 2; fill: none; }
    .raster { stroke: #d8d0c2; stroke-width: 1; fill: none; }
    .linie  { stroke: #c0472a; stroke-width: 9; stroke-linecap: round; }
    .kopf   { fill: #c0472a; }
    .txt    { fill: #5c5548; font: 500 13px 'Archivo', system-ui, sans-serif; }
    .txt-ax { fill: #8a8271; font: 700 11px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .08em; }
  ]]></style>

  <rect class="grund" x="0" y="0" width="640" height="360"/>

  <!-- Raster: vier waagerechte Hilfslinien, ohne Zahlen — die Amplitude ist hier
       nicht die Frage, und beschriftete Werte würden nur ablenken. -->
  <line class="raster" x1="70" y1="70"  x2="600" y2="70"/>
  <line class="raster" x1="70" y1="128" x2="600" y2="128"/>
  <line class="raster" x1="70" y1="186" x2="600" y2="186"/>
  <line class="raster" x1="70" y1="244" x2="600" y2="244"/>

  <!-- Achsen -->
  <line class="achse" x1="70" y1="292" x2="600" y2="292"/>
  <line class="achse" x1="70" y1="292" x2="70"  y2="52"/>

  <!-- Sechs Spektrallinien. Höhe fällt mit der Ordnungszahl; die Linie bei
       100 Hz ist mit Absicht vorhanden, obwohl sie dort nicht hingehört. -->
  <line class="linie" x1="121" y1="292" x2="121" y2="88"/>
  <circle class="kopf" cx="121" cy="88" r="6"/>

  <line class="linie" x1="217" y1="292" x2="217" y2="210"/>
  <circle class="kopf" cx="217" cy="210" r="6"/>

  <line class="linie" x1="313" y1="292" x2="313" y2="160"/>
  <circle class="kopf" cx="313" cy="160" r="6"/>

  <line class="linie" x1="409" y1="292" x2="409" y2="244"/>
  <circle class="kopf" cx="409" cy="244" r="6"/>

  <line class="linie" x1="505" y1="292" x2="505" y2="196"/>
  <circle class="kopf" cx="505" cy="196" r="6"/>

  <line class="linie" x1="577" y1="292" x2="577" y2="262"/>
  <circle class="kopf" cx="577" cy="262" r="6"/>

  <!-- Frequenzachse in Hertz -->
  <text class="txt-ax" x="121" y="313" text-anchor="middle">50</text>
  <text class="txt-ax" x="217" y="313" text-anchor="middle">100</text>
  <text class="txt-ax" x="313" y="313" text-anchor="middle">150</text>
  <text class="txt-ax" x="409" y="313" text-anchor="middle">200</text>
  <text class="txt-ax" x="505" y="313" text-anchor="middle">250</text>
  <text class="txt-ax" x="577" y="313" text-anchor="middle">300</text>

  <text class="txt" x="600" y="338" text-anchor="end">Frequenz in Hz</text>
  <text class="txt" x="70" y="40" text-anchor="start">Amplitude</text>
</svg>
